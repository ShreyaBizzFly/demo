<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Forgot password — Demo SaaS</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Reset your password</h1>
    <p class="hint" style="text-align:left;margin-top:0;">Enter your email and we'll send you a reset link.</p>
    <form id="forgotForm">
      <label for="email">Email</label>
      <input id="email" type="email" required />

      <button class="btn" type="submit">Send reset link</button>
      <div class="error" id="error"></div>
    </form>
    <div class="hint" id="successMsg" style="display:none;color:#1c1e26;"></div>
    <div class="hint"><a href="/login.html">Back to login</a></div>
  </div>
</div>
<script>
const form = document.getElementById('forgotForm');
const errorEl = document.getElementById('error');
const successEl = document.getElementById('successMsg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.textContent = '';
  successEl.style.display = 'none';

  const email = document.getElementById('email').value;
  const res = await fetch('/api/forgot-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email }),
  });
  const data = await res.json();
  if (!res.ok) {
    errorEl.textContent = data.error;
    return;
  }
  successEl.textContent = data.message;
  successEl.style.display = 'block';
  form.style.display = 'none';
});
</script>
</body>
</html>
